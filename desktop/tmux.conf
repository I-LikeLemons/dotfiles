unbind r 
bind r source-file ~/.tmux.conf
set -g prefix C-s
set-option -ga terminal-overrides ",xterm-256color:Tc"
bind m new-window -c "#{pane_current_path}"
set -g base-index 1 # start windows numbering at 1
set-option -g mode-keys vi
set-option -g allow-passthrough on
set-option -g status-position top
set -g status-style bg=default
set -g status-right "%I:%M"
set -g status-left "[#S] "
set -g window-status-current-style bg=default,fg=default
set -g status-justify centre

unbind l
bind l select-pane -R
bind h select-pane -L

setw -g window-status-current-format '[#{pane_current_command}]'
setw -g window-status-format '#{pane_current_command}'

bind -r C-l resize-pane -R 5
bind -r C-h resize-pane -L 5
bind -r C-k resize-pane -U 5
bind -r C-j resize-pane -D 5
